<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesan Untukmu</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FACC15; /* Kuning Solid */
    --panel: #FFFFFF;
    --text: #171717;
    --border: #171717;
    --accent-pink: #F472B6;
    --accent-blue: #60A5FA;
  }
  
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Space Grotesk', sans-serif;
  }
  
  body {
    background-color: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    overflow-x: hidden;
  }

  /* Pola grid latar belakang ala Brutalist */
  body::before {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: radial-gradient(var(--border) 1px, transparent 0);
    background-size: 24px 24px;
    opacity: 0.1;
    z-index: -1;
  }
  
  .container {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 3px solid var(--border);
    box-shadow: 6px 6px 0px var(--border);
    padding: 32px;
    text-align: center;
    position: relative;
    border-radius: 0px !important;
  }
  
  h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 24px;
    line-height: 1.4;
    text-transform: uppercase;
    letter-spacing: -0.5px;
  }

  p {
    font-size: 18px;
    font-weight: 700;
    margin-top: 16px;
    text-transform: uppercase;
  }
  
  .btn {
    background: var(--panel);
    border: 3px solid var(--border);
    box-shadow: 4px 4px 0px var(--border);
    padding: 12px 24px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    text-transform: uppercase;
    border-radius: 0px !important;
    margin-top: 12px;
  }
  
  .btn:active {
    transform: translate(4px, 4px);
    box-shadow: 0px 0px 0px var(--border);
  }
  
  .btn-primary { background: var(--accent-pink); }
  .btn-secondary { background: var(--accent-blue); }
  
  .step { display: none; }
  .step.active { display: block; }
  
  /* Area Main Tombol GAK */
  #play-area {
    position: relative;
    width: 100%;
    height: 140px;
    margin-top: 24px;
  }
  
  #btn-mau {
    position: absolute;
    left: 10%;
    top: 30px;
    background: var(--accent-pink);
    z-index: 2;
  }
  
  #btn-gak {
    position: absolute;
    right: 10%;
    top: 30px;
    background: var(--panel);
    z-index: 2;
  }
  
  /* Pemutar Musik Melayang */
  .music-player {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--panel);
    border: 3px solid var(--border);
    box-shadow: 4px 4px 0px var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 50;
  }
  
  .music-info {
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
  }
  
  .play-btn {
    background: var(--accent-blue);
    border: 3px solid var(--border);
    padding: 6px 12px;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
  }

  .play-btn:active {
    transform: translate(2px, 2px);
  }

  @media (max-width: 480px) {
    .music-player {
      bottom: 16px;
      right: 16px;
      left: 16px;
      justify-content: space-between;
    }
  }
</style>
</head>
<body>

<div class="container">
  <!-- Langkah 1 -->
  <div id="step1" class="step active">
    <h1>Ada pertanyaan penting buat kamu.</h1>
    <button class="btn btn-primary" onclick="nextStep(1)">Buka Pertanyaan</button>
  </div>

  <!-- Langkah 2 -->
  <div id="step2" class="step">
    <h1>Tahu gak bedanya kamu sama WiFi?</h1>
    <button class="btn btn-secondary" onclick="nextStep(2)">Apa bedanya?</button>
  </div>

  <!-- Langkah 3 -->
  <div id="step3" class="step">
    <h1>Kalau WiFi buat internetan, kalau kamu buat aku ajak jalan.</h1>
    <p>Hari ini jalan yuk?</p>
    <div id="play-area">
      <button id="btn-mau" class="btn" onclick="nextStep(3)">MAU</button>
      <button id="btn-gak" class="btn" onmouseover="moveButton()" ontouchstart="moveButton()" onclick="moveButton()">GAK</button>
    </div>
  </div>

  <!-- Langkah 4 -->
  <div id="step4" class="step">
    <h1>MANTAP.</h1>
    <p>Siap-siap ya, nanti aku kabarin lagi.</p>
    <p style="margin-top: 32px; font-size: 14px;">- Rafli</p>
  </div>
</div>

<!-- Pemutar Musik -->
<div class="music-player">
  <div class="music-info">BGM: I Thought I Saw</div>
  <button class="play-btn" id="playBtn" onclick="togglePlay()">PLAY</button>
  
  <!-- Audio (Ganti link src di bawah ini jika punya link mp3 aslinya) -->
  <audio id="bgm" loop>
    <source src="sound.mp3" type="audio/mpeg">
  </audio>
</div>

<script>
  function nextStep(current) {
    document.getElementById(`step${current}`).classList.remove('active');
    document.getElementById(`step${current + 1}`).classList.add('active');
  }

  // Fungsi agar tombol GAK selalu menghindar
  function moveButton() {
    const btn = document.getElementById('btn-gak');
    const area = document.getElementById('play-area');
    
    // Batas maksimal pergerakan tombol dalam area
    const maxX = area.clientWidth - btn.clientWidth;
    const maxY = area.clientHeight - btn.clientHeight;
    
    // Posisi acak baru
    const randomX = Math.max(0, Math.floor(Math.random() * maxX));
    const randomY = Math.max(0, Math.floor(Math.random() * maxY));
    
    btn.style.left = randomX + 'px';
    btn.style.top = randomY + 'px';
  }

  // Fungsi Pemutar Audio
  const audio = document.getElementById('bgm');
  const playBtn = document.getElementById('playBtn');
  let isPlaying = false;

  function togglePlay() {
    if (isPlaying) {
      audio.pause();
      playBtn.textContent = 'PLAY';
      playBtn.style.background = 'var(--accent-blue)';
    } else {
      audio.play();
      playBtn.textContent = 'PAUSE';
      playBtn.style.background = 'var(--bg)';
    }
    isPlaying = !isPlaying;
  }
</script>

</body>
</html>
